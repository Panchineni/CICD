name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show repository api variable
        env:
          API: ${{ vars.api }}
        run: |
          echo "Repository api: $API"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

  show_prod_variable:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Show prod environment api variable
        env:
          API: ${{ vars.api }}
        run: |
          echo "Prod environment api: $API"
